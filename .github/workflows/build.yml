name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  # By hand, on any branch. Ticking "lto" builds that commit the way a release
  # tag would, which is how a main build is checked against the release build
  # of the same source: compare the two runs' Audio fingerprint steps.
  workflow_dispatch:
    inputs:
      lto:
        description: 'Link-time optimise the plugins, as a release tag does'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The DSP of every module has no JUCE dependency, so what the modules claim
  # about themselves is checked in seconds on a bare container. It runs first
  # and independently, because it is the job whose failure means the sound
  # changed.
  dsp:
    name: DSP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBMO_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # BMO Tune RT is in this repository and not in the rack. That is only true
  # while each side still builds and passes its own suites with the other
  # switched off, so both directions are built here rather than trusted. Same
  # container as the job above, seconds each.
  independence:
    name: Each side alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tune alone
        run: |
          cmake -B build-tune -DBMO_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DBMO_BUILD_RACK=OFF
          cmake --build build-tune --parallel
          ctest --test-dir build-tune --output-on-failure

      - name: The rack alone
        run: |
          cmake -B build-rack -DBMO_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DBMO_BUILD_TUNE=OFF
          cmake --build build-rack --parallel
          ctest --test-dir build-rack --output-on-failure

  plugin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 90, not 60. The Windows build ran 54 to 59 minutes on four of the five
    # runs before 2026-10-01, and the
    # first push after the tenth module's UI work went over: the job was
    # cancelled at 60.5 minutes with nothing wrong in it, which also means no
    # BMO-Windows package for that commit. A timeout is there to stop a hung
    # job, not to race a healthy one, so it sits well clear of the longest
    # honest run. macOS finishes in 10 to 17 minutes and is unaffected.
    timeout-minutes: 90
    # Link-time optimisation is for what someone downloads, so release tags
    # only -- and a run started by hand that asks for it. Measured on
    # 2026-10-01: the Windows Build step took 36 to 55 minutes with it, at up
    # to 97 % compiler-cache hits, because every plugin link regenerates that
    # plugin's code where no cache can help; without it the same step took
    # 14.4 minutes, and macOS 1.5. So pull requests and main skip it. What they
    # package is therefore not bit-for-bit the release build, and the Audio
    # fingerprint step below is how the two are shown to make the same samples.
    # See the BMO_LTO option in CMakeLists.txt and tools/fingerprint/README.md.
    env:
      BMO_LTO: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.lto) && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "${{ runner.os }}" = "macOS" ]; then brew install ninja; else choco install ninja -y; fi
          fi
          ninja --version

      # The typefaces are licensed and not in the repository; they arrive as
      # secrets. See assets/fonts/README.md.
      - name: Restore fonts
        shell: bash
        env:
          MINERVA: ${{ secrets.FONT_TG_MINERVA_BLACK_B64 }}
          BLENDER: ${{ secrets.FONT_TG_BLENDER_B64 }}
        run: |
          if [ -z "$MINERVA" ] || [ -z "$BLENDER" ]; then
            echo "No font secrets reached this run."
            echo
            echo "Two different things cause that, and this step cannot tell them"
            echo "apart -- an unset secret and a withheld one both arrive empty."
            echo "Check the runner header above: 'Secret source: None' means the"
            echo "second case, not the first."
            echo
            echo "  1. A pull request from a fork. GitHub does not pass repository"
            echo "     secrets to fork PRs, so they can be set perfectly well and"
            echo "     still not arrive. Push the branch to this repository and"
            echo "     open the pull request from there; that run gets them."
            echo
            echo "  2. FONT_TG_MINERVA_BLACK_B64 and FONT_TG_BLENDER_B64 are"
            echo "     genuinely unset here. assets/fonts/README.md says how to"
            echo "     set them."
            echo
            echo "  event:     ${{ github.event_name }}"
            echo "  this repo: ${{ github.repository }}"
            echo "  head repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}"
            echo
            echo "If those last two differ, it is case 1."
            exit 1
          fi
          mkdir -p assets/fonts
          printf '%s' "$MINERVA" | base64 --decode | gunzip > assets/fonts/TG-MinervaBlack-Black.otf
          printf '%s' "$BLENDER" | base64 --decode | gunzip > assets/fonts/TG-Blender.otf
          ls -la assets/fonts/

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Two settings, both from measurements taken on 2026-10-01.
      #
      # max-size: the Windows cache was 99.4 to 99.99 % full at 800M on every
      # run, which means one whole build's objects just about fit and the next
      # module will not. Past that point the cache evicts entries it wrote
      # earlier in the same build and the hit rate falls for good. 1200M is
      # room for the suite to grow; macOS uses about 160M and is unaffected.
      #
      # save: only a push saves a cache; a pull request restores and does not
      # save. Every run used to save a fresh timestamped archive, about 755 MB
      # on Windows, and the repository was at 10.6 GB of GitHub's 10 GB cache
      # allowance, so archives were being evicted to make room for ones nobody
      # would read. A pull request still starts from main's latest cache. What
      # it gives up is its own second run restoring its own first, which was
      # worth at most the gap between a 77 % and a 97 % hit rate -- and the
      # Build step took 36 to 49 minutes at 97 % either way, because most of
      # it is link-time work no compiler cache can serve.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 1200M
          save: ${{ github.event_name != 'pull_request' }}

      - name: Configure
        shell: bash
        run: |
          args=(-B build -G Ninja -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_C_COMPILER_LAUNCHER=ccache
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Universal binaries cost double to compile and only matter for
            # something someone downloads, so tags only.
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              args+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
            else
              args+=(-DCMAKE_OSX_ARCHITECTURES="arm64")
            fi
          fi
          args+=(-DBMO_LTO="$BMO_LTO")
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      # To re-solve preset levels after a DSP change, set
      # BMO_PRINT_PRESET_LEVELS here and run ctest with -V rather than
      # --output-on-failure: the tests then print every preset's measured
      # delta instead of only the ones outside tolerance, and -V is required
      # because --output-on-failure shows a test's stdout only when it fails,
      # which suppresses exactly the output you want from a passing run.
      # Both come straight back out afterwards, as they did in 0.2.1.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Packaging inherits the implicit `if: success()`, so a failing test
      # withholds the build. While BMO Opto was under active preset/level
      # iteration, add-bmo-opto and its v0.x tags carried a carve-out that
      # packaged on Build alone -- a failing level-match test there was
      # usually a not-yet-retuned preset value rather than a reason to
      # withhold something worth listening to. That carve-out is gone: the
      # levels are solved and the branch is green.
      - name: Package
        shell: bash
        run: tools/packager/package.sh build out

      - uses: actions/upload-artifact@v4
        with:
          name: BMO-${{ matrix.name }}
          path: out/

      # One hash per product of the audio it makes from a fixed input, loaded
      # as a host loads it. Two runs of one commit on one platform that print
      # the same last line built plugins that make the same samples, whether
      # or not either was link-time optimised. It fails only if a plugin does
      # not load or does not repeat itself; no hash is expected, because every
      # DSP change moves them on purpose. It comes after the upload, so a
      # failure here marks the run without withholding the build. See
      # tools/fingerprint/README.md.
      - name: Audio fingerprint
        shell: bash
        run: |
          echo "BMO_LTO=$BMO_LTO" | tee fingerprint.txt
          build/tools/audio_fingerprint build | tee -a fingerprint.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BMO-${{ matrix.name }}-fingerprint
          path: fingerprint.txt
          if-no-files-found: ignore
